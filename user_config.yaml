simulation:
  sim.CLTS: 5.0e-05
  sim.NUMBER_OF_STEPS: 4000
  sim.MACHINE_SIM_PER_CONTROL: 1
  sim.MODE_SELECT: 4
  sim.NUNMBER_OF_STEPS: 4000
  sim.MACHINE_SIMULATIONs_PER_SAMPLING_PERIOD: 1 # 500 enable simulation of SVPWM in ACMSimPy
  sim.DOWN_SAMPLE: 1
  user.set_iq_command: 2
  

  ##############################
  ####用户自己使用的变量在下面####
  ##############################
  user.verbose: TRUE

motor:
  motor.NAME: SEW100W
  motor.npp: 4
  motor.IN: 3.5
  motor.R: 0.475
  motor.Ld: 0.00205
  motor.Lq: 0.00205
  motor.KE: 0.0107
  motor.Js: 3.5e-06
  motor.Vdc: 48
control:
  FOC.CURRENT_BW: 100.0
  FOC.SPEED_BW: 10.0
  FOC.VL_EXE_PER_CL_EXE: 10
test:
  test.cmd_speed: 100.0
  test.cmd_iD: 0.0
  test.cmd_iQ: 1.0
  test.cmd_uD: 0.0
  test.cmd_uQ: 5.0
  test.TLoad: 0.0
  test.TLoad_time: 0.1
output:
  output.DATA_FILE: ../dat/test_motor.dat
  output.verbose: true

default_var_list:
  - sim.CLTS
  - sim.NUMBER_OF_STEPS
  - sim.MACHINE_SIM_PER_CONTROL
  - sim.MODE_SELECT
  - init.IN
  - init.R
  - init.Ld
  - init.KE
  - init.Js
  # - sim.NUMBER_OF_STEPS
  # - sim.CLTS
  # - sim.MACHINE_SIMULATIONs_PER_SAMPLING_PERIOD
  # - FOC.delta
  # - FOC.CLBW_HZ

config:
  mpl:
    mathtext.fontset: stix
    font.family: STIXGeneral
  plt:
    font.weight: 400
    font.size: 20
    legend.fontsize: 15
    legend.labelspacing: 0.3
    axes.facecolor: 'none'
    axes.labelcolor: '#000000'
    axes.axisbelow: 'False'
    axes.labelsize: 24
    axes.edgecolor: '#000000'
    xtick.labelsize: 24
    ytick.labelsize: 24
    ytick.color: '#000000'
    xtick.color: '#000000'
    text.color: '#000000'
    legend.edgecolor: '#000000'
    grid.color: '#000000'
    grid.linestyle: '--'
    grid.linewidth: 0.8
    grid.alpha: 0.5
    text.usetex: False
  
  cjh_colors: [
        '#FF0000',  # orangered - 更深的红色，提高对比度
        '#000000',  # black - 保持黑色
        '#0057D9',  # deep blue - 适应白底的深蓝色
        '#FF8C00',  # vivid yellow - 适应白底的亮黄色
        '#8A2BE2',  # blue violet
        '#008000',  # purple - 深紫色，提升对比度
        '#800080',  # green - 适应白底的绿色
        '#E60000',  # bright red - 纯红色，醒目r
        '#0057D9',  # strong blue - 深蓝色，提高可见性
        '#9400D3',  # dark violet - 深紫色
        '#20B2AA',  # light sea green - 深青色
        '#D2691E',  # chocolate - 深棕色，适应白底
        '#DC143C',  # crimson - 深红色
        '#1E90FF',  # dodger blue - 明亮的蓝色
        '#8B4513',  # saddle brown - 深棕色
        '#696969',  # dim gray - 深灰色
        '#A52A2A',  # brown - 适应白底的深棕色
        '#556B2F',  # dark olive green - 深橄榄绿
        '#2F4F4F',  # dark slate gray - 深青灰色
        '#000080',  # navy - 深蓝色，提高对比度
    ] # https://uxdesign.cc/dark-mode-ui-design-the-definitive-guide-part-1-color-53dcfaea5129

signal_library:
  - ACM.x[0]
  - ACM.x[1]
  - ACM.x[2]
  - ACM.x[3]
  - ACM.x[4]
  - ACM.theta_d/M_PI*180
  - ACM.varOmega * MECH_RAD_PER_SEC_2_RPM
  - ACM.uAB[0]
  - ACM.uAB[1]
  - ACM.uDQ[0]
  - ACM.uDQ[1]
  - ACM.iAB[0]
  - ACM.iAB[1]
  - ACM.iDQ[0]
  - ACM.iDQ[1]
  - ACM.TLoad
  - ACM.Tem
  - ACM.KA
  - (*CTRL).i->cmd_varOmega * MECH_RAD_PER_SEC_2_RPM
  - (*CTRL).i->iAB[0]
  - (*CTRL).i->iAB[1]
  - (*CTRL).i->iDQ[0]
  - (*CTRL).i->iDQ[1]
  - (*CTRL).timebase


cplot:
  title:
  x_data:             # default is time
  x_label: Time [s]
  width: 20
  height: 0.5     # per subplot height
  subplot:
    - # Subplot 1
      title: Speed
      y_title: Speed [r/min]
      y:
        -
          y_data: (*CTRL).i->cmd_varOmega * MECH_RAD_PER_SEC_2_RPM
          y_label: $\omega^*$
        -
          y_data: ACM.varOmega * MECH_RAD_PER_SEC_2_RPM
          y_label: ACM.$\omega$
        -
          y_data: (*CTRL).i->varOmega * MECH_RAD_PER_SEC_2_RPM
          y_label: CTRL.$\omega$
        -
          y_data: OFSR.esoaf.xOmg * ELEC_RAD_PER_SEC_2_RPM
          y_label: OFSR.esoaf.$\omega$
    - # Subplot 2
      title: iQ
      y_title: Q-axis Current [A]
      y:
        -
          y_data: (*CTRL).i->cmd_iDQ[1]
          y_label: $i_q^*$
        -
          y_data: (*CTRL).i->iDQ[1]
          y_label: $i_q$
    - # Subplot 3
      title: Torque
      y_title: Torque [Nm]
      y:
        -
          y_data: ACM.TLoad
          y_label: $T_{L}$
        -
          y_data: ACM.Tem
          y_label: $T_{\rm em}$
        # -
        #  y_data : (*CTRL).i->Tem
        #  y_label: $CTRL_{T_{em}}$
    - # Subplot 4
      title: iD
      y_title: D-axis Current [A]
      y:
        -
          y_data: (*CTRL).i->cmd_iDQ[0]
          # y_data: (*CTRL).i->iAB[0]
          y_label: $i_d^*$
        -
          y_data: (*CTRL).i->iDQ[0]
          y_label: $i_d$
    - # Subplot 5
      title: Vdc Util
      y_title: ratio [100%]
      y:
        -
          y_data:  (*CTRL).o->dc_bus_utilization_ratio
          y_label: $\eta_{Vdc}$
    - # Subplot 6
      title: uAB
      y_title: Voltage [V]
      y:
        -
          y_data:  ACM.uDQ[0]
          y_label: $u_d$
        -
          y_data: ACM.uDQ[1]
          y_label: $u_q$
        -
          y_data: ACM.uAB[0]
          y_label: $u_\alpha$
        -
          y_data: ACM.uAB[1]
          y_label: $u_\beta$
    - # Subplot XX
      title: Simualtion Timebase
      y_title: Second
      y:
        -
          y_data: (*CTRL).timebase
          y_label: time
    - # Subplot 7
      title: Active Flux
      y_title: Active Flux 
      y:
        -
          y_data: ACM.KA
          y_label: 'KA'
        -
          y_data: ACM.x[2]
          y_label: 'x[2]'
        -
          y_data: (*CTRL).i->cmd_psi
          y_label: '$\psi^*$'